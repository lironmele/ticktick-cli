[package]
name = "ticktick-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
tabled = "0.16"
tabled_derive = "0.8"

[profile.release]
opt-level = 3
lto = true